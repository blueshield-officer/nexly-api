name: Build Check & Promote to Master

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (check only, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: symfony-app:build-check
          # cache-from/cache-to can be added later to speed up repeat builds

  promote-to-master:
    needs: build-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into master
        run: |
          git fetch origin master dev
          git checkout master
          git merge origin/dev -m "Merge dev into master [ci]"
          git push origin master
          
  push-image:
    needs: promote-to-master
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/spacebureaucrats/nexly-api:latest
            ghcr.io/spacebureaucrats/nexly-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
